# path: java/forge/src/main/resources/META-INF/mods.toml
modLoader = "javafml"
loaderVersion = "[24,]"
license = "LGPL-3.0"

[[mods]]
modId = "enchantmotion"
version = "${version}"
displayName = "EnchantMotion"
logoFile = "icon.png"
description = '''
Dynamic visual animations, orbiting runes, floating tools, and glint effects for Minecraft enchanting.
'''
authors = "Developer"

[[mixins]]
config = "enchantmotion.mixins.json"

[[dependencies.enchantmotion]]
modId = "forge"
mandatory = true
versionRange = "[65.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.enchantmotion]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"
