# path: java/neoforge/src/main/resources/META-INF/neoforge.mods.toml
modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0"

[[mods]]
modId = "enchantmotion"
version = "${version}"
displayName = "EnchantMotion"
logoFile = "icon.png"
description = '''
Dynamic visual animations, orbiting runes, floating tools, and glint effects for Minecraft enchanting.
'''
authors = "Developer"

[[mixins]]
config = "enchantmotion.mixins.json"

[[dependencies.enchantmotion]]
modId = "neoforge"
type = "required"
versionRange = "[21.0.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.enchantmotion]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,)"
ordering = "NONE"
side = "BOTH"
