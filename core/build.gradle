// path: core/build.gradle
plugins {
    id 'java-library'
}

group = 'com.enchantmentanimation'
version = project.findProperty('mod_version') ?: '1.0.1'

sourceSets {
    main {
        java {
            srcDirs = ['.']
            exclude 'test/**'
            exclude 'build/**'
            exclude '.gradle/**'
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
